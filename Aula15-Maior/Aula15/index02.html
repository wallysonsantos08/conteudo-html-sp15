<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <title>Conteúdo Aula15 - HTML</title>
  </head>
  <body>
    
    <h1>Caminhos de Arquivos no HTML</h1>

    <h3>Arquivo no mesmo nível do HTML</h3>

    <img src="carro-senna.png" width="250" height="140">

    <hr>

    <h3>Arquivo em uma pasta de mesmo nível que o HTML</h3>

    <img src="img/carro-senna.png" width="250" height="140">

    <hr>

    <h3>Arquivo em uma pasta na raíz da estrutura</h3>

    <img src="/Aula15-img/carro-senna.png" width="250" height="140">

    <hr>

    <h3>Arquivo em nível maior que o HTML</h3>

    <img src="../carro-senna.png" width="250" height="140">

  </body>
</html>

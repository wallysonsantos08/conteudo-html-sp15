<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Definindo imagens html</h1>

    <img src="img/messicareca.jpg" alt="O melhor de todos os tempos, e esta careca de saber" width="769" height="970">

    <h3>Definindo altura e largura de imagem usando CSS </h3>

    <img src="img/messicareca.jpg" alt="O melhor de todos os tempos, e esta careca de saber" style="width: 769px; height: 970px;">

    <hr>

    <h3>Utilizando imagens dinamicas no HTML</h3>

    <img src="img/messi-maceta-real.gif" alt="messi gostoso"
    style="height: 480px;width: 480px;">

    <hr>

    <h3>Utilizando imagem flutuante</h3>

    <p>
        <img src="img/messi-maceta-real.gif" alt="messi gostoso" style="width: 240px; height: 240px; float: right;">
        Somente a dor coletiva gera a união.
    </p>

    <hr>

</body>
</html>

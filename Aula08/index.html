<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <title>Conteúdo Aula08 - HTML</title>
  </head>
  <body>
    
    <h1>Definindo links em HTML</h1>

    <a href="https://www.w3schools.com">Clique aqui</a>

    <hr>

    <h3>Utilizando o valor _blank no atributo target de um link</h3>

    <a href="https://www.w3schools.com" target="_blank">Clique aqui para abrir o link em outra aba</a>

    <hr>

    <h3>Exemplos de URL Absoluta e URL Relativa</h3>

    <a href="https://www.w3schools.com">Exemplo de URL Absoluta</a>
    <br>
    <br>
    <a href="/Aula07/index.html">Exemplo de URL Relativa</a>

    <hr>

    <h3>Definindo imagem como link</h3>

    <a href="https://pt.wikipedia.org/wiki/Neymar" target="_blank">
        <img src="neymar.jpg" alt="Imagem do ney" width="300" height="300">
    </a>

    

    

  </body>
</html>

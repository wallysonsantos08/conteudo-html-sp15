<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteudo Aula10 - HTML</title>
</head>
<body>

    <h1>Definindo listas no HTML</h1>

    <hr>

    <h3>Exemplo de lista não ordenada</h3>

    <ul>

        <li>Item</li>
        <li>Item</li>
        <li>Item</li>
        <li>Item</li>
        <li>Item</li>
        
    </ul>

    <h3>Exemplo de lista ordenada</h3>

    <ol>

        <li>Item</li>
        <li>Item</li>
        <li>Item</li>
        <li>Item</li>
        <li>Item</li>

    </ol>
    
</body>
</html>
